<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Detalles del Producto</title>
  <style>
    body { 
      background-color: #27eb27b0; 
      color: #fc7fe1d3; 
      font-family: Arial, sans-serif; 
      margin: 0; 
      transition: background-color 0.3s; 
    }
    .product-container { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 40px 20px; 
    }
    .product-image { 
      display: flex; 
      justify-content: center; 
      margin-bottom: 20px; 
    }
    .product-image img { 
      max-width: 200px; 
      height: auto; 
      margin: 0 10px; 
      cursor: pointer; 
      transition: transform 0.3s; 
    }
    .product-image img:hover { 
      transform: scale(1.05); 
    }
    .product-details { 
      background-color: #d597d8; 
      color: #2c2c2c; 
      padding: 30px; 
      border-radius: 10px; 
      width: 80%; 
      max-width: 600px; 
      text-align: center; 
      transition: background-color 0.3s, color 0.3s; 
    }
    .product-name { 
      font-size: 24px; 
      font-weight: bold; 
      margin-bottom: 10px; 
    }
    .product-description { 
      margin-bottom: 20px; 
    }
    .product-options { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    .product-options label { 
      margin-right: 10px; 
    }
    .product-options input[type="number"], .product-options select { 
      width: 100px; 
      padding: 8px 12px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      font-size: 14px; 
      margin: 0 10px; 
    }
    .buy-button, .add-to-cart-button, .retired-button { 
      display: inline-block; 
      background-color: #2e7faa; 
      color: #faefef; 
      padding: 12px 24px; 
      text-decoration: none; 
      border-radius: 5px; 
      font-size: 16px; 
      transition: background-color 0.3s; 
      margin-top: 10px; 
    }
    .buy-button:hover, .add-to-cart-button:hover { 
      background-color: #2e7add; 
    }
  </style>
</head>
<body>
  <div class="product-container">
    <div class="product-image">
      <img src="img/s7.jpg" alt="Producto 1" onmouseover="showColor('Azul Celeste', '#00BFFF', '#fff', '#FF69B4', '#00BFFF')" onmouseout="clearColor()" onclick="selectColor('Azul Celeste', '#00BFFF', '#fff')">
      <img src="img/s8.jpg" alt="Producto 2" onmouseover="showColor('Naranja', '#FFA500', '#000', '#8B008B', '#FFA500')" onmouseout="clearColor()" onclick="selectColor('Naranja', '#FFA500', '#000')">
    </div>
    <div class="product-details" id="details">
      <div class="product-name">Sujetador Deportivo Suelto</div>
      <div class="product-description">Este sujetador deportivo está diseñado para brindar el máximo soporte y comodidad durante tus actividades físicas.</div>
      <div class="product-options">
        <label for="size">Talla:</label>
        <select id="size"><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option></select>
        <label for="quantity">Cantidad:</label>
        <input type="number" id="quantity" min="1" value="1">
        <h3>Precio: $270</h3>
      </div>
      <div style="display: flex; align-items: center; justify-content: center;"><label id="colorLabel" style="margin-right: 10px;">Color: Ninguno</label></div>
      <button class="add-to-cart-button" id="addToCartButton">Añadir al Carrito</button>
      <a href="#" class="buy-button" id="buyButton">Comprar</a>
      <a href="otroProducto.html" class="retired-button" id="retired-Button">Regresar</a>
    </div>
  </div>

  <script>
    let selectedColor = 'Ninguno';
    const pricePerUnit = 270;
    let selectedBackgroundColor = '';
    let selectedTextColor = '';

    function showColor(color, bgColor, textColor, pageBgColor, productBgColor) {
      document.getElementById("colorLabel").innerText = "Color: " + color;
      document.getElementById("details").style.backgroundColor = productBgColor; 
      document.getElementById("details").style.color = textColor; 
      document.body.style.backgroundColor = pageBgColor; 
    }

    function clearColor() {
      if (selectedColor === 'Ninguno') {
        document.getElementById("colorLabel").innerText = "Color: Ninguno";
        document.getElementById("details").style.backgroundColor = '#fc7fe1d3'; 
        document.getElementById("details").style.color = '#333'; 
        document.body.style.backgroundColor = '#27eb27b0'; 
      } else {
        document.getElementById("details").style.backgroundColor = selectedBackgroundColor; 
        document.getElementById("details").style.color = selectedTextColor; 
      }
    }

    function selectColor(color, bgColor, textColor) {
      selectedColor = color;
      selectedBackgroundColor = bgColor;
      selectedTextColor = textColor;
      document.getElementById("colorLabel").innerText = "Color: " + color;
      document.getElementById("details").style.backgroundColor = bgColor; 
      document.getElementById("details").style.color = textColor; 
    }

    document.getElementById('addToCartButton').onclick = function(){
      const quantity = document.getElementById('quantity').value;
      const size = document.getElementById('size').value;
      const total = quantity * pricePerUnit;

      const product = {
        name: "Sujetador Deportivo Suelto",
        size: size,
        color: selectedColor,
        quantity: parseInt(quantity),
        subtotal: total
      };

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push(product);
      localStorage.setItem('cart', JSON.stringify(cart));
      alert("Producto añadido al carrito: " +
        "Nombre: Sujetador Deportivo Suelto, " +
        "Talla: " + size + ", " +
        "Color: " + selectedColor + ", " +
        "Cantidad: " + quantity + ", " +
        "Subtotal: $" + total);
    };

    document.getElementById('buyButton').onclick = function() {
      const nombreDelProducto = "Sujetador Deportivo Suelto";
      const quantity = document.getElementById('quantity').value;
      const total = quantity * pricePerUnit;
      const size = document.getElementById('size').value;
      const url = `metodo de pago.html?producto=${encodeURIComponent(nombreDelProducto)}&total=${total}&size=${size}&color=${selectedColor}&quantity=${quantity}`;
      window.location.href = url;
    };
  </script>
</body>
</html>
