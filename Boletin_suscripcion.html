<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Suscripción - Nike</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #190fde;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
        }
        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #ff4c00;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #e04300;
        }
        .boton {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            box-sizing: border-box;
        }
        .boton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Suscripción a Nike</h2>
        
        <form id="suscripcionForm" action="php/suscripcion.php" method="POST">
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
            <input type="email" id="correo" name="correo" placeholder="Correo Electrónico" required>
            <input type="tel" id="telefono" name="telefono" placeholder="Número de Teléfono" required>
            <button type="submit">Suscribirse</button>
            
            <button type="button" class="boton" onclick="window.location.href='menu2.html'">Regresar</button>
        </form>
    </div>
</body>
</html>
